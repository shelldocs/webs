<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI-X 심화반 15기 · 조별 프로젝트</title>

<!-- 본문·제목: Pretendard / 라벨: IBM Plex Mono -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" href="../css/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">발표자료</p>
    <h1><span class="en">AI-X</span> 심화반<span class="gi"><br>15기</span><span style="color:var(--sig-1)"> 발표자료</span></h1>
    <!-- <p class="lede">조별로 만든 프로젝트를 한곳에 모았습니다. 보고 싶은 조를 고르면 해당 사이트로 이동합니다.</p> -->
  </header>

  <main class="teams">

    <!-- ▼ 제목 · 설명 · 태그 · href 주소만 바꾸면 됩니다 -->

    <a class="row" style="--sig:var(--sig-1)" href="p1" target="_parent" rel="noopener">
      <span class="num">1<em>회</em></span>
      <div>
        <p class="team">8월 4일 (화)</p>
        <h2 class="title">미니프로젝트 발표</h2>
        <p class="desc">미니프로젝트</p>
      </div>
      <span class="go">바로가기 <i>→</i></span>
    </a>

    <a class="row" style="--sig:var(--sig-4)" href="p2" target="_parent" rel="noopener">
      <span class="num">2<em>회</em></span>
      <div>
        <p class="team">8월 11일 (화)</p>
        <h2 class="title">기획 발표</h2>
        <p class="desc">최종 프로젝트</p>
      </div>
      <span class="go">바로가기 <i>→</i></span>
    </a>

    <a class="row" style="--sig:var(--sig-2)" href="p3" target="_parent" rel="noopener">
      <span class="num">3<em>회</em></span>
      <div>
        <p class="team">8월 21일 (금)</p>
        <h2 class="title">중간 발표</h2>
        <p class="desc">최종 프로젝트</p>
      </div>
      <span class="go">바로가기 <i>→</i></span>
    </a>

    <a class="row" style="--sig:var(--sig-3)" href="p4" target="_parent" rel="noopener">
      <span class="num">4<em>회</em></span>
      <div>
        <p class="team">10월 21일 (월)</p>
        <h2 class="title">최종 발표</h2>
        <p class="desc">최종 프로젝트</p>
      </div>
      <span class="go">바로가기 <i>→</i></span>
    </a>

    <!-- ▲ 조를 더 추가하려면 위 블록을 복사하고 --sig 색만 바꾸세요 -->

  </main>

  <footer>
    <span>AI-X 심화반 16기 · 조별 프로젝트</span>
    <span>사이트가 열리지 않으면 각 조에 문의하세요</span>
  </footer>

</div>
</body>
</html>
